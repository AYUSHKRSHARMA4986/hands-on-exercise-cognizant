<div class="home-container">
  <!-- Interpolation Binding -->
  <h1>Welcome to the {{ portalName }}</h1>
  <p>Manage your enrollments, explore new courses, and track your academic progress all in one place.</p>

  <!-- Two-Way Binding -->
  <div style="margin: 20px 0;">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Search courses...">
    <p>Searching for: <strong>{{ searchTerm }}</strong></p>
  </div>

  <!-- Property and Event Binding -->
  <div style="margin: 20px 0;">
    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
    <p style="color: green; font-weight: bold;">{{ message }}</p>
  </div>

  <!-- Keep your existing stats-row down here! -->
  <div class="stats-row">
    <div class="stat-card">
      <h3>Courses Available</h3>
      <p>12</p>
    </div>
    <div class="stat-card">
      <h3>Enrolled</h3>
      <p>3</p>
    </div>
    <div class="stat-card">
      <h3>GPA</h3>
      <p>3.8</p>
    </div>
  </div>
</div>
