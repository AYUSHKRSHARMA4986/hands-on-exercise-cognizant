<div class="form-container">
  <h2>Course Enrollment Request</h2>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <div class="form-group">
      <label>Student Name:</label>
      <input type="text" name="studentName" ngModel required minlength="3" #nameCtrl="ngModel">
      <div *ngIf="nameCtrl.invalid && (nameCtrl.dirty || nameCtrl.touched)" class="error-msg">
        <small *ngIf="nameCtrl.errors?.['required']">Name is required.</small>
        <small *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters long.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Student Email:</label>
      <input type="email" name="studentEmail" ngModel required email #emailCtrl="ngModel">
      <div *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)" class="error-msg">
        <small *ngIf="emailCtrl.errors?.['required']">Email is required.</small>
        <small *ngIf="emailCtrl.errors?.['email']">Please enter a valid email address.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Course ID:</label>
      <input type="number" name="courseId" ngModel required #courseCtrl="ngModel">
      <div *ngIf="courseCtrl.invalid && (courseCtrl.dirty || courseCtrl.touched)" class="error-msg">
        <small *ngIf="courseCtrl.errors?.['required']">Course ID is required.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Preferred Semester:</label>
      <select name="preferredSemester" ngModel required #semesterCtrl="ngModel">
        <option value="" disabled>Select a semester</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
      <div *ngIf="semesterCtrl.invalid && (semesterCtrl.dirty || semesterCtrl.touched)" class="error-msg">
        <small *ngIf="semesterCtrl.errors?.['required']">Please select a semester.</small>
      </div>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" name="agreeToTerms" ngModel required #termsCtrl="ngModel">
      <label>I agree to the terms and conditions</label>
      <div *ngIf="termsCtrl.invalid && (termsCtrl.dirty || termsCtrl.touched)" class="error-msg">
        <small *ngIf="termsCtrl.errors?.['required']">You must agree to the terms.</small>
      </div>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid" class="submit-btn">
      Submit Request
    </button>
  </form>
</div>
